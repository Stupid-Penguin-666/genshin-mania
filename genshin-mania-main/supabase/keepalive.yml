# Optional: stops a free Supabase project from pausing for inactivity.
# Copy this file to .github/workflows/keepalive.yml in your repository and add
# two repository secrets: SUPABASE_URL (https://<ref>.supabase.co) and
# SUPABASE_KEY (the public anon/publishable key).
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"   # every third day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the beatmaps table
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/beatmaps?select=id&limit=1"
